<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Agendamento SUS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card-cadastro { width: 100%; max-width: 500px; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .logo-sus { color: #005c97; font-weight: bold; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="card card-cadastro bg-white">
        <div class="card-body">
            <h3 class="logo-sus">🏥 Cadastro SUS</h3>
            <p class="text-center text-muted">Crie sua conta de paciente</p>

            <div id="alerta" class="alert d-none" role="alert"></div>

            <form id="formCadastro">
                <div class="mb-3">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" id="nome" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" class="form-control" id="senha" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Confirmar Senha</label>
                        <input type="password" class="form-control" id="confirmaSenha" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 mb-3">Cadastrar</button>
                <a href="/" class="btn btn-outline-secondary w-100">Voltar para Login</a>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('formCadastro');
        const alerta = document.getElementById('alerta');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const confirmaSenha = document.getElementById('confirmaSenha').value;

            // Validação simples no frontend
            if (senha !== confirmaSenha) {
                mostrarAlerta('As senhas não coincidem!', 'danger');
                return;
            }

            try {
                const response = await fetch('/cadastro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha })
                });

                const data = await response.json();

                if (data.success) {
                    mostrarAlerta('Cadastro realizado com sucesso! Redirecionando...', 'success');
                    setTimeout(() => { window.location.href = '/'; }, 2000);
                } else {
                    mostrarAlerta(data.message, 'danger');
                }

            } catch (error) {
                mostrarAlerta('Erro ao conectar com o servidor.', 'danger');
            }
        });

        function mostrarAlerta(msg, tipo) {
            alerta.textContent = msg;
            alerta.className = `alert alert-${tipo}`; // Muda cor (vermelho ou verde)
            alerta.classList.remove('d-none');
        }
    </script>
</body>
</html>
